run_name: "api"

# Rollout
max_depth: 10
max_nodes: 512
lean_workers: 4
lean_timeout: 60
sorrifier_max_cycles: 50

# Best-first search
search_batch_size: 4
initial_tactic_k: 4
initial_skeleton_k: 4
retry_tactic_k: 4
retry_skeleton_k: 4
max_tactic_per_state: 16
max_skeleton_per_state: 16
min_tactic_before_skeleton: 8
promising_tactic_r_env: 0.4
strong_tactic_r_env: 0.7
state_beam_width: 24
state_beam_per_depth: 8
skeleton_beam_per_state: 1
skeleton_commitment: true
max_reserved_skeletons_per_state: 2
commit_stale_rounds_before_fallback: 2
max_tactic_feedbacks: 10
max_skeleton_feedbacks: 10

# Heuristic scorer
heuristic:
  incoming_skeleton_weight: 2.0
  best_tactic_weight: 1.5
  final_child_bonus: 6.0
  solved_ratio_bonus: 2.0
  parent_depth_bonus: 1.0
  depth_penalty: 0.1
  tactic_retry_penalty: 0.10
  skeleton_retry_penalty: 0.12
  bad_skeleton_round_penalty: 0.8
  skeleton_r_env_weight: 2.0
  skeleton_parent_score_weight: 0.6
  skeleton_depth_penalty: 0.25
  skeleton_sorrified_penalty: 0.25
  committed_child_bonus: 8.0
  last_child_committed_bonus: 20.0
  committed_solved_ratio_bonus: 3.0


max_new_tokens: 8192
temperature: 1.0

# Logging
log_dir: "outputs/runs"

# Rollout graph logging
rollout_graph_log_dir: "outputs/rollouts"

# vLLM config (Override defaults to avoid OOM)
vllm_port: 8000
vllm_gpu_memory_utilization: 0.9
max_model_len: 8192
