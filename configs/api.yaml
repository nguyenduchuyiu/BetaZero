run_name: "api"

# Rollout
K: 16
max_depth: 10
max_nodes: 512
lean_workers: 4
lean_timeout: 120
sorrifier_max_cycles: 100


max_new_tokens: 8192
temperature: 1.0

# Logging
log_dir: "outputs/runs"

# Rollout graph logging
rollout_graph_log_dir: "outputs/rollouts"

# vLLM config (Override defaults to avoid OOM)
vllm_port: 8000
vllm_gpu_memory_utilization: 0.9
max_model_len: 8192
