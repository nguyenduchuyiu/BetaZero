run_name: "deepseek-r1-distill-7b"

# Model 
model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
device: "cuda"

# Rollout
max_depth: 10
max_nodes: 512
lean_workers: 4
lean_timeout: 120
sorrifier_max_cycles: 100

# Best-first search
search_batch_size: 4
initial_tactic_k: 4
retry_tactic_k: 4
max_tactic_per_state: 16
initial_skeleton_k: 4
retry_skeleton_k: 2
max_skeleton_per_state: 8
state_beam_width: 32
state_beam_per_depth: 8
skeleton_beam_per_state: 2
max_skeleton_feedbacks: 3

# GRPO
lr: 0.000005
eps_clip: 0.2
beta_kl: 0.05 
grpo_epochs: 1
mini_batch_size: 2
grpo_accumulation_steps: 32

# Training loop
total_iterations: 20
theorems_per_iter: 1
checkpoint_every: 1
checkpoint_dir: "outputs/checkpoints"
# 0 = train on current iter only. >0 = stack samples until >= this (weak iters still add to buffer).
min_samples_for_grpo: 32

# Dataset
dataset_dir: "problems/miniF2F-Valid"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]


# Training efficiency
gradient_checkpointing: true
logprob_chunk_size: 2
max_new_tokens: 10000
temperature: 1.0

# Logging
log_dir: "outputs/runs"

# vLLM
vllm_port: 8000
vllm_gpu_memory_utilization: 0.9
max_model_len: 8192
vllm_ready_timeout: 900

# Rollout graph logging
rollout_graph_log_dir: "outputs/rollouts"
